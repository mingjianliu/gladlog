<title>危机应对判读</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #eef0f6;
  --surface: #ffffff;
  --surface-2: #f5f6fb;
  --hairline: #d9dbe6;
  --ink: #1b1d2a;
  --ink-2: #4a4e63;
  --mute: #7c8096;
  --accent: #5d50b3;
  --accent-fill: #ebe8fb;
  --gold: #b07f14;
  --gold-soft: #f3e3bd;
  --win: #2f8f63;
  --win-fill: #dff2e8;
  --loss: #b84b4b;
  --loss-fill: #f8e1e1;
  --unk: #6b6f86;
  --unk-fill: #e7e8ef;
  --shadow: 0 1px 2px rgba(20, 22, 40, .06), 0 8px 24px rgba(20, 22, 40, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161826;
    --surface: #1b1e2c;
    --surface-2: #12141f;
    --hairline: #33364a;
    --ink: #e9e9ed;
    --ink-2: #b2b6ca;
    --mute: #7e8297;
    --accent: #9184d9;
    --accent-fill: #2b2741;
    --gold: #d9a842;
    --gold-soft: #3a3120;
    --win: #7ac9a3;
    --win-fill: #1f3329;
    --loss: #e08585;
    --loss-fill: #3a2426;
    --unk: #a4a8bd;
    --unk-fill: #2a2d3d;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #161826;
  --surface: #1b1e2c;
  --surface-2: #12141f;
  --hairline: #33364a;
  --ink: #e9e9ed;
  --ink-2: #b2b6ca;
  --mute: #7e8297;
  --accent: #9184d9;
  --accent-fill: #2b2741;
  --gold: #d9a842;
  --gold-soft: #3a3120;
  --win: #7ac9a3;
  --win-fill: #1f3329;
  --loss: #e08585;
  --loss-fill: #3a2426;
  --unk: #a4a8bd;
  --unk-fill: #2a2d3d;
  --shadow: none;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Inter", "Noto Sans SC", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.55;
  padding-inline: 16px;
  padding-block: 20px 48px;
  font-variant-numeric: tabular-nums;
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 16px; }
header.top { display: grid; gap: 10px; }
h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.ask { margin: 0; color: var(--ink-2); max-width: 62ch; }
.ask b { color: var(--ink); font-weight: 600; }
.pips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pip {
  width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--hairline);
  background: var(--surface); color: var(--mute); font-size: 11px; font-weight: 600;
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
.pip.answered { background: var(--win-fill); border-color: var(--win); color: var(--win); }
.pip.unanswered { background: var(--loss-fill); border-color: var(--loss); color: var(--loss); }
.pip.insufficient { background: var(--unk-fill); border-color: var(--unk); color: var(--unk); }
.pip.current { outline: 2px solid var(--accent); outline-offset: 2px; }
.pip:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.count { color: var(--mute); font-size: 13px; margin-left: 6px; }
.save { font-size: 12px; color: var(--mute); }

.card {
  background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px;
  box-shadow: var(--shadow); overflow: hidden;
}
.card-head {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px;
  padding: 16px 20px 12px;
}
.who { font-size: 18px; font-weight: 700; }
.meta { color: var(--mute); font-size: 13px; }
.hp {
  padding: 0 20px 16px; display: grid; gap: 6px;
}
.hpbar {
  position: relative; height: 14px; border-radius: 4px; background: var(--surface-2);
  border: 1px solid var(--hairline); overflow: hidden;
}
.hpbar .now { position: absolute; inset: 0 auto 0 0; background: var(--gold); }
.hpbar .lost {
  position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, var(--gold-soft) 0 5px, transparent 5px 9px);
  border-left: 1px solid var(--gold);
}
.hpline { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; color: var(--ink-2); }
.hpline strong { color: var(--ink); font-weight: 600; }

.facts { border-top: 1px solid var(--hairline); display: grid; }
.row {
  display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 11px 20px;
  border-bottom: 1px solid var(--hairline);
}
.row:last-child { border-bottom: 0; }
.row .k { color: var(--mute); font-size: 13px; padding-top: 2px; }
.row .v { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.chip {
  display: inline-flex; gap: 6px; align-items: baseline; padding: 2px 9px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--hairline); font-size: 13.5px; white-space: nowrap;
}
.chip .t { color: var(--mute); font-size: 12px; }
.chip.prot { background: var(--accent-fill); border-color: transparent; }
.chip.est { border-style: dashed; }
.none { color: var(--mute); font-size: 13.5px; }
.note { color: var(--mute); font-size: 12.5px; flex-basis: 100%; }
.big { font-weight: 700; font-size: 16px; margin-right: 4px; }

.judge { padding: 16px 20px 18px; border-top: 1px solid var(--hairline); background: var(--surface-2); display: grid; gap: 12px; }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.choice {
  font: inherit; font-weight: 600; padding: 10px 8px; border-radius: 8px; cursor: pointer;
  background: var(--surface); color: var(--ink); border: 1px solid var(--hairline);
}
.choice kbd { font: 500 11px/1 "Inter", sans-serif; color: var(--mute); border: 1px solid var(--hairline); border-radius: 4px; padding: 2px 5px; margin-left: 6px; }
.choice[data-v="answered"][aria-pressed="true"] { background: var(--win-fill); border-color: var(--win); color: var(--win); }
.choice[data-v="unanswered"][aria-pressed="true"] { background: var(--loss-fill); border-color: var(--loss); color: var(--loss); }
.choice[data-v="insufficient"][aria-pressed="true"] { background: var(--unk-fill); border-color: var(--unk); color: var(--unk); }
textarea {
  font: inherit; width: 100%; min-height: 58px; resize: vertical; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--hairline); background: var(--surface); color: var(--ink);
}
.reveal { border-radius: 8px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--hairline); display: grid; gap: 2px; font-size: 14px; }
.reveal .l { color: var(--mute); font-size: 12.5px; }
.nav { display: flex; justify-content: space-between; gap: 8px; }
.navbtn { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--hairline); background: var(--surface); color: var(--ink); cursor: pointer; }
.navbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.navbtn:disabled { opacity: .4; cursor: default; }
.legend { color: var(--mute); font-size: 12.5px; }
@media (max-width: 480px) {
  .row { grid-template-columns: 1fr; gap: 4px; }
  .choices { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: opacity .12s ease; }
}
</style>

<div class="wrap">
  <header class="top">
    <h1>危机应对判读</h1>
    <p class="ask">每张卡是一名治疗血线跌破 40% 的那一刻。<b>只判断：这一刻的危机有没有被应对</b>——算上身上已经开着的保护、之后 3 秒的治疗和减伤、他自己和队友做的事。活没活下来不算数，判完才揭晓。</p>
    <div class="pips" id="pips" aria-label="进度"></div>
    <div class="save" id="save">正在连接保存…</div>
  </header>
  <section class="card" id="card" aria-live="polite"></section>
  <p class="legend">虚线框 = 起始时间是推断的。键盘：1 应对了 · 2 没应对 · 3 证据不足 · ← → 翻页。</p>
</div>

<script>
const CARDS = __CARDS__;
const COLL = "judgements";
const LS_KEY = "gladlog-crisis-judge-v1";
let db = null;
let judgements = {};
let cur = 0;
try { judgements = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (e) { judgements = {}; }

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const LABEL = { answered: "应对了", unanswered: "没应对", insufficient: "证据不足" };

function chipList(arr, render, emptyText) {
  if (!arr.length) return `<span class="none">${emptyText}</span>`;
  return arr.map(render).join("");
}

function renderCard() {
  const c = CARDS[cur];
  const j = judgements[c.id] || {};
  const hp = c.hp ?? 0;
  const lost = Math.min(100 - hp, c.dmgPct ?? 0);
  const move = c.move
    ? `<span>自己移动 <span class="big">${c.move.owner}</span>码</span>` +
      c.move.attackers.map((a) => a.unknown
        ? `<span class="chip">${esc(a.name)} <span class="t">位置未知</span></span>`
        : `<span class="chip">${esc(a.name)} <span class="t">距离 ${a.d0}→${a.d1} 码 · 他动了 ${a.moved} 码</span></span>`).join("")
    : `<span class="none">位置采样不够，未知</span>`;
  const heals = c.healTop.map((h) => `<span class="chip">${esc(h.name)} <span class="t">${h.pct ?? "?"}% · ${esc(h.who)}${h.periodic ? " · 持续" : ""}</span></span>`).join("")
    + (c.healRestN ? `<span class="chip"><span class="t">其余 ${c.healRestN} 个小来源共 ${c.healRestPct}%</span></span>` : "");
  const absorbed = c.absorbed.map((a) => `<span class="chip">${esc(a.name)} <span class="t">吸收 ${a.k}k</span></span>`).join("");
  const html = `
    <div class="card-head">
      <span class="who">${esc(c.spec)}</span>
      <span class="meta">${esc(c.bracket)} · 第 ${esc(c.time)} · 回合 ${esc(c.id)} · ${cur + 1}/${CARDS.length}</span>
    </div>
    <div class="hp">
      <div class="hpbar" role="img" aria-label="血量 ${hp}%，前 2 秒掉了 ${c.dmgPct}%">
        <div class="now" style="width:${hp}%"></div>
        <div class="lost" style="left:${hp}%;width:${lost}%"></div>
      </div>
      <div class="hpline">
        <span>血量 <strong>${hp}%</strong></span>
        <span>前 2 秒掉了 <strong>${c.dmgPct ?? "?"}%</strong></span>
        <span>在打他：<strong>${c.attackers.map(esc).join("、") || "未识别"}</strong></span>
      </div>
    </div>
    <div class="facts">
      <div class="row"><div class="k">身上已有</div><div class="v">
        ${chipList(c.protection, (p) => `<span class="chip prot${p.estimated ? " est" : ""}">${esc(p.name)} <span class="t">${esc(p.tag)} · ${esc(p.who)}</span></span>`, "没有识别到保护")}
        ${c.ccOnOwner.map((x) => `<span class="chip">被控：${esc(x.name)} <span class="t">${esc(x.who)}</span></span>`).join("")}
        ${c.unclassified ? `<span class="note">另有 ${c.unclassified} 个光环没识别，未计入</span>` : ""}
      </div></div>
      <div class="row"><div class="k">3 秒内回血</div><div class="v">
        <span class="big">${c.healPct}%</span><span class="t" style="color:var(--mute);font-size:13px;margin-right:6px">最大血量</span>
        ${heals || ""}${absorbed}
      </div></div>
      <div class="row"><div class="k">他自己按了</div><div class="v">
        ${chipList(c.casts, (x) => `<span class="chip">${esc(x.name)} <span class="t">${x.fn.length ? esc(x.fn.join("、")) : "无官方功能记录"}${x.target ? " → " + esc(x.target) : ""}</span></span>`, "3 秒内没有成功施法")}
      </div></div>
      <div class="row"><div class="k">新挂的保护</div><div class="v">
        ${chipList(c.newProtection, (x) => `<span class="chip prot">${esc(x.name)} <span class="t">${esc(x.fn.join("、"))} · ${esc(x.who)}</span></span>`, "无")}
      </div></div>
      <div class="row"><div class="k">控到攻击者</div><div class="v">
        ${chipList(c.ccOnAttackers, (x) => `<span class="chip">${esc(x.who)} 的 ${esc(x.name)} <span class="t">→ ${esc(x.target)}</span></span>`, "无")}
      </div></div>
      <div class="row"><div class="k">走位</div><div class="v">${move}</div></div>
    </div>
    <div class="judge">
      <div class="choices" role="group" aria-label="判断">
        ${["answered", "unanswered", "insufficient"].map((v, i) => `<button class="choice" type="button" id="choice-${v}" data-v="${v}" aria-pressed="${j.verdict === v}">${LABEL[v]}<kbd>${i + 1}</kbd></button>`).join("")}
      </div>
      <textarea id="reason" placeholder="一句理由（可选）：比如「树皮在身上，3 秒回了 30%」">${esc(j.reason || "")}</textarea>
      ${j.verdict ? `<div class="reveal"><span class="l">揭晓</span>
        <span>产品现在判：${c.product.responded ? "有反应（" + esc(c.product.via.join("+") || "?") + "）" : "没反应"}</span>
        <span>10 秒内：${c.died ? "死了" : "没死"}</span>
        ${j.revisedAfterReveal ? `<span class="l">揭晓后改过判断</span>` : ""}</div>` : ""}
      <div class="nav">
        <button class="navbtn" type="button" id="prev" ${cur === 0 ? "disabled" : ""}>上一张</button>
        <button class="navbtn primary" type="button" id="next" ${cur === CARDS.length - 1 ? "disabled" : ""}>下一张</button>
      </div>
    </div>`;
  document.getElementById("card").innerHTML = html;
  for (const b of document.querySelectorAll(".choice")) b.addEventListener("click", () => judge(b.dataset.v));
  document.getElementById("reason").addEventListener("change", (e) => {
    const cj = judgements[c.id];
    if (cj) { cj.reason = e.target.value; persist(c.id); }
  });
  document.getElementById("prev").addEventListener("click", () => go(cur - 1));
  document.getElementById("next").addEventListener("click", () => go(cur + 1));
  renderPips();
}

function renderPips() {
  const done = CARDS.filter((c) => judgements[c.id]?.verdict).length;
  document.getElementById("pips").innerHTML =
    CARDS.map((c, i) => `<button type="button" class="pip ${judgements[c.id]?.verdict || ""} ${i === cur ? "current" : ""}" id="pip-${i}" aria-label="第 ${i + 1} 张${judgements[c.id]?.verdict ? "，" + LABEL[judgements[c.id].verdict] : ""}">${i + 1}</button>`).join("") +
    `<span class="count">已判 ${done}/${CARDS.length}</span>`;
  for (const [i, el] of [...document.querySelectorAll(".pip")].entries()) el.addEventListener("click", () => go(i));
}

function go(i) { if (i < 0 || i >= CARDS.length) return; cur = i; renderCard(); }

function judge(v) {
  const c = CARDS[cur];
  const prev = judgements[c.id];
  const reason = document.getElementById("reason")?.value ?? "";
  judgements[c.id] = {
    verdict: v,
    reason,
    at: new Date().toISOString(),
    revisedAfterReveal: !!(prev?.verdict && prev.verdict !== v) || !!prev?.revisedAfterReveal,
    firstVerdict: prev?.firstVerdict ?? v,
  };
  persist(c.id);
  renderCard();
}

async function persist(id) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(judgements)); } catch (e) {}
  if (!db) return;
  try {
    await db.doc(`${COLL}/${id}`).set(judgements[id]);
    setSave(`已保存到服务器 · ${new Date().toLocaleTimeString()}`);
  } catch (e) {
    setSave(`保存失败（${e?.code || "未知错误"}），先存在本机浏览器里`);
  }
}
function setSave(t) { document.getElementById("save").textContent = t; }

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === "1") judge("answered");
  else if (e.key === "2") judge("unanswered");
  else if (e.key === "3") judge("insufficient");
  else if (e.key === "ArrowRight") go(cur + 1);
  else if (e.key === "ArrowLeft") go(cur - 1);
});

renderCard();

(async () => {
  db = await window.claude?.use?.("db");
  if (!db) { setSave("没连上服务器保存，判断只存在这台浏览器里"); return; }
  try {
    const snap = await db.collection(COLL).get();
    for (const d of snap.docs ?? []) {
      const data = typeof d.data === "function" ? d.data() : d.data;
      if (data?.verdict) judgements[d.id] = { ...judgements[d.id], ...data };
    }
    for (const id of Object.keys(judgements)) if (judgements[id]?.verdict) await db.doc(`${COLL}/${id}`).set(judgements[id]);
    setSave("判断会自动保存到服务器");
    renderCard();
  } catch (e) {
    setSave(`读取服务器保存失败（${e?.code || "未知错误"}），判断先存在本机浏览器里`);
  }
})();
</script>
